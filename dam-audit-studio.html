  if(!a.desc)f.push('noDesc');if(!a.alt)f.push('noAlt');if(!a.tags.length)f.push('noTags');if(!a.collections.length)f.push('noColl');if(!a.desc&&!a.tags.length)f.push('noBoth');

function computeGov(){const has=(a,f)=>a.flags.includes(f);

 for(const a of S.assets){
  a.expired=has(a,'expired');a.expSoon=has(a,'expSoon');a.bad=has(a,'badStatus');a.badFolder=has(a,'badFolder');a.gen=has(a,'genTitle');a.stale=has(a,'stale');
  a.ok=S.appr.size?S.appr.has(a.status.toLowerCase()):FINAL.test(a.status);
  a.age=a.modified?Math.max(0,Math.round((S.asOf-a.modified)/864e5)):null;
  a.nm=Object.keys(NMR).filter(k=>NMR[k][1](a));
  a.rk=Object.keys(RK).filter(k=>RK[k][2](a));a.rl=a.rk.some(k=>RK[k][1]==='h')?3:a.rk.some(k=>RK[k][1]==='m')?2:a.rk.length?1:0;
  a.fs=sum(FC,c=>c[2](a));a.fsw=FC.filter(c=>c[2](a)<c[1]).map(c=>c[0]);
  a.rot={R:a.dupe,O:a.bad||a.expired||a.badFolder||(a.stale&&!a.collections.length),T:!a.tags.length&&!a.desc&&!a.collections.length}}

 for(const a of S.assets){a.brk=a.rel.filter(i=>!S.byId.has(i));a.one=a.rel.filter(i=>{const b=S.byId.get(i);return b&&!b.rel.includes(a.id)});a.unl=false;

  for(const [v,n] of m)if(vs.has(v)||rare.has(v))vr.push({r,v,n,note:vs.has(v)?'Variant spelling':'Rarely used (possible off-list)'})}

 stk('l1c',libs,[{n:'Linked',c:C.blue,d:libs.map(l=>rate(A.filter(a=>a.lib===l),a=>a.rel.length))},{n:'Not linked',c:C.g3,d:libs.map(l=>rate(A.filter(a=>a.lib===l),a=>!a.rel.length))}],{rot:20,on:(lib,s)=>gl(s+' — '+lib,'',A.filter(a=>a.lib===lib&&(s==='Linked')===(a.rel.length>0)),{cols:rc})});
 const L=[['No related assets',no],['Broken links',br],['One-way links',one],['Unlinked variants',un]];
 simpleBar('l2c',L.map(x=>[x[0],x[1].length]),{h:true,lw:160,onClick:n=>gl(n,'',L.find(x=>x[0]===n)[1],{cols:rc})});
 regTable('l_tb',rc,iss,{k:'t',dir:1,limit:200,file:'related-asset-issues.csv'})};

/* PAGE: audit pack & backlog */
const PN=['Metadata completeness','Naming compliance','Rights (no high risk)','ROT-free','Findability','Workflow (not stuck)','Related coverage'];
const isStuck=a=>!a.ok&&a.age!=null&&a.age>S.th.stuck;
function scoreOf(as){const n=as.length;if(!n)return null;
 const p=[100*sum(as,a=>a.meta)/n,rate(as,a=>!a.nm.length),100-rate(as,a=>a.rl===3),100-rate(as,aR),sum(as,a=>a.fs)/n,100-rate(as,isStuck),rate(as,a=>a.rel.length)];return{p,o:p.reduce((s,x)=>s+x,0)/p.length}}
const BL=[
 ['Rights','P1','Withdraw or renew assets that are expired but still Approved','High','Low',a=>a.rk.includes('expA')],
 ['Rights','P1','Renew or retire expired assets','High','Medium',a=>a.expired],
 ['ROT','P1','Archive or delete assets in a cleanup status','High','Low',a=>a.bad],
 ['Metadata','P1','Add tags and a description to assets that have neither','High','High',a=>!a.tags.length&&!a.desc],
 ['Rights','P2','Renew or replace assets expiring within 90 days','Medium','Medium',a=>a.expSoon],
 ['Rights','P2','Add an expiry date to licensed assets','Medium','Low',a=>!!a.license&&!a.expires],
 ['Rights','P2','Add a copyright notice','Medium','Medium',a=>!a.copyNotice],
 ['ROT','P2','Review and remove duplicate copies','Medium','Medium',a=>a.dupe],
 ['Findability','P2','Improve tags, description and alt text on assets scoring below 50','Medium','High',a=>a.fs<50],
 ['Workflow','P2','Decide on assets stuck outside the Approved status','Medium','Medium',isStuck],
 ['Naming','P2','Rename assets with generic titles','Medium','Medium',a=>a.gen],
 ['Related','P2','Fix broken related-asset links','Medium','Low',a=>a.brk.length>0],
 ['Taxonomy','P2','Replace tags that are not on the approved list','Medium','Medium',a=>S.apprTags.size>0&&a.tags.some(t=>!S.apprTags.has(t.toLowerCase()))],
 ['Naming','P3','Fix other naming-rule breaks','Low','Medium',a=>a.nm.some(k=>k!=='gen')],
 ['Related','P3','Make one-way links two-way','Low','Low',a=>a.one.length>0],
 ['Related','P3','Link likely variants to each other','Low','Medium',a=>a.unl],
 ['ROT','P3','Enrich or remove trivial assets','Low','Medium',a=>a.rot.T]];
function backlog(A){const out=[];
 for(const [area,p,txt,sev,eff,f] of BL){const rows=A.filter(f);if(!rows.length)continue;const o=topN(cnt(rows,a=>a.creator||'(unknown)'),1)[0];out.push({area,p,txt,sev,eff,rows,n:rows.length,owner:o[0],on:o[1]})}
 out.sort((a,b)=>a.p>b.p?1:a.p<b.p?-1:b.n-a.n);out.forEach((x,i)=>x.id='B'+String(i+1).padStart(2,'0'));return out}
PAGES.audit=()=>{const A=cur(),libs=activeLibs(),all=scoreOf(A),bl=backlog(A),p1=bl.filter(x=>x.p==='P1'),inst=sum(bl,x=>x.n);
 const SR=[{name:'All libraries in view',lib:'',as:A,s:all},...libs.map(l=>{const as=A.filter(a=>a.lib===l);return{name:l,lib:l,as,s:scoreOf(as)}})].filter(r=>r.s);
 const sc=r=>Math.round(r.s.o);
 $('#view').innerHTML=`<div class="bar noprint"><button class="btn pri" id="pr">Print / save as PDF</button><button class="btn" id="lg">Download issue log (CSV)</button></div>
 <div class="kpis">
 ${all?kpi('Overall score',sc(SR[0])+'/100','average of 7 dimensions',kc(sc(SR[0]))):kpi('Overall score','–')}
 ${kpi('Assets in scope',fmtN(A.length),libs.length+' libraries'+(S.stat?' · status: '+esc(S.stat):''))}
 ${kpi('Backlog items',fmtN(bl.length),fmtN(inst)+' asset-level findings in total')}
 ${kpi('Priority 1 items',fmtN(p1.length),fmtN(sum(p1,x=>x.n))+' findings',p1.length?'r':'g')}</div>
 <div class="card"><h3>Library scorecard</h3><p class="mut">Each dimension is 0–100 (higher is better); the overall score is their average. Metadata completeness = average of description, alt text, tags and © notice. Naming = share with no naming issue. Rights = share without a High risk. ROT-free = share that is not redundant, obsolete or trivial. Findability = average score. Workflow = share not stuck outside Approved (&gt; ${S.th.stuck} days). Related = share with at least one related asset. Click a row to list the assets.</p><div id="au_tb"></div></div>
 ${card('Overall score by library','au1',300)}
 <div class="card"><h3>Action backlog</h3><p class="mut">Priority: P1 = rights exposure, cleanup status or fully unsearchable assets; P2 = medium risk or findability; P3 = housekeeping. Effort and severity are rule-of-thumb defaults, not estimates. Owner = creator of most affected assets. Click a row to list the assets.</p><div id="au_bl"></div></div>
 <div class="card"><h3>Scope and sign-off</h3><p class="mut">Libraries: ${esc(libs.join(', '))} · Folder filter: ${esc(S.scope?[S.scope.lib,...S.scope.parts].join(' › '):'none')} · Status filter: ${esc(S.stat||'all')} · As-of date: ${fmtD(S.asOf)} · Stale after ${S.th.stale} y · Stuck after ${S.th.stuck} d · Approved statuses: ${esc(S.th.appr||'default (Approved, Published, Final)')} · Naming pattern: ${esc(S.th.pat||'none')} · Approved tags: ${S.apprTags.size?fmtN(S.apprTags.size):'none'}</p>
 <div class="sign"><div>Prepared by / date</div><div>Reviewed by / date</div><div>Approved by / date</div></div></div>`;
 regTable('au_tb',[{k:'name',l:'Library',v:r=>r.name},{k:'n',l:'Assets',v:r=>r.as.length,num:1,f:r=>fmtN(r.as.length)},...PN.map((n,i)=>({k:'p'+i,l:n,v:r=>m1(r.s.p[i]),num:1,f:r=>hb(Math.round(r.s.p[i]))})),{k:'o',l:'Overall',v:r=>r.s.o,num:1,f:r=>hb(sc(r))}],SR,{k:'o',dir:1,limit:50,file:'library-scorecard.csv',click:r=>gl(r.name+' — assets','',r.as,{cols:cl('t','lib','p','st','fs','rk','rot','dta')})});
 simpleBar('au1',SR.slice(1).map(r=>[r.name,sc(r),hcol(sc(r))]),{rot:20});
 const pb={P1:'r',P2:'o',P3:'m'};
 regTable('au_bl',[{k:'id',l:'ID',v:x=>x.id},{k:'p',l:'Priority',v:x=>x.p,f:x=>`<span class="b ${pb[x.p]}">${x.p}</span>`},{k:'area',l:'Area',v:x=>x.area},{k:'txt',l:'Action',v:x=>x.txt,f:x=>esc(x.txt)},{k:'sev',l:'Severity',v:x=>x.sev},{k:'eff',l:'Effort',v:x=>x.eff},{k:'n',l:'Assets',v:x=>x.n,num:1,f:x=>fmtN(x.n)},{k:'sh',l:'% of view',v:x=>m1(100*x.n/A.length),num:1,f:x=>P(x.n,A.length)},{k:'ow',l:'Owner (most assets)',v:x=>x.owner,f:x=>esc(x.owner)+' ('+fmtN(x.on)+')'}],bl,{k:'p',dir:1,limit:60,file:'action-backlog.csv',click:x=>gl(x.id+' · '+x.txt,x.area+' · '+x.p,x.rows,{cols:cl('t','lib','p','st','cr','rk','rot','dta')})});
 $('#pr').onclick=()=>window.print();
 $('#lg').onclick=()=>dl('audit-issue-log.csv',bl.flatMap(x=>x.rows.map(a=>({'Backlog ID':x.id,Priority:x.p,Area:x.area,Issue:x.txt,Library:a.lib,'Asset ID':a.id,Title:a.title,Folder:a.path,Status:a.status,Creator:a.creator}))))};

/* events */
document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest(s);let x;
 if(x=c('[data-tab]')){S.tab=x.dataset.tab;render();return}
 if(x=c('[data-lib]')){const n=x.dataset.lib;S.active.has(n)?S.active.delete(n):S.active.add(n);if(S.scope&&!S.active.has(S.scope.lib))S.scope=null;render();return}
 if(c('[data-scope-clear]')){S.scope=null;render();return}
 if(x=c('[data-drill]')){const f=DRILLS[x.dataset.drill];f&&f();return}
 if(x=c('th[data-tb]')){const id=x.dataset.tb,tb=TB[id],k=x.dataset.k;if(tb.k===k)tb.dir*=-1;else{tb.k=k;tb.dir=tb.cols.find(q=>q.k===k).num?-1:1}drawTable(id);return}
 if(x=c('[data-more]')){e.preventDefault();TB[x.dataset.more].limit+=200;drawTable(x.dataset.more);return}
 if(x=c('[data-exp]')){e.preventDefault();exportTable(x.dataset.exp);return}
 if(x=c('tr[data-i]')){const tb=TB[x.dataset.tb];if(tb&&tb.click)tb.click(tb.rows[+x.dataset.i]);return}
 if(c('[data-dr-close]')){closeDrawer();return}
 if(c('[data-dr-back]')){if(DR&&DR.prev)openDrawer(DR.prev);return}
 if(c('[data-dr-explore]')){if(DR&&DR.ex)go({tab:'explorer',...DR.ex});return}
 if(x=c('[data-mview]')){S.mm.view=x.dataset.mview;render();return}
 if(x=c('[data-ins]')){go(S._ins[+x.dataset.ins].g);return}
 if(x=c('[data-insl]')){const f=S._ins[+x.dataset.insl];gl(htmlTxt(f.t),insArea(f.area),f.rows,f.cols?{cols:f.cols}:{});return}
 if(x=c('[data-insf-sev]')){S.insF.sev=x.dataset.insfSev;render();return}
 if(c('#ins_dl')){dl('nuggets.csv',S._ins.map(x=>({Severity:SEVN[x.sev],Report:insArea(x.area),Finding:htmlTxt(x.t),Detail:htmlTxt(x.x),Assets:x.rows?x.rows.length:''})));return}
 if(x=c('[data-crumb]')){e.preventDefault();const k=+x.dataset.crumb;S.scope=k<0?null:{lib:S.scope.lib,parts:S.scope.parts.slice(0,k)};render();return}
 if(c('[data-miss-clear]')){S.exp.miss='';render();return}
 if(x=c('[data-rm]')){S.files.splice(+x.dataset.rm,1);drawFiles();return}
 if(c('#go')){analyse();return}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='fi'){parseFiles(t.files).then(drawFiles);t.value='';return}
 if(t.hasAttribute('data-scope')){const l=+t.dataset.scope,v=t.value;S.scope=l===0?(v?{lib:v,parts:[]}:null):{lib:S.scope.lib,parts:S.scope.parts.slice(0,l-1).concat(v?[v]:[])};render();return}
 if(t.hasAttribute('data-stat')){S.stat=t.value;render();return}
 if(t.hasAttribute('data-insf-area')){S.insF.area=t.value;render();return}
 const ex={ex_lib:'lib',ex_flag:'flag',ex_ext:'ext',ex_direct:'direct'};if(ex[t.id]){S.exp[ex[t.id]]=t.value;drawExplorer();return}
 if(t.id==='fa_i'){S.fa.issue=t.value;drawFolders();return}
 if(t.id==='st_lib'){S.st.lib=t.value;render();return}
 if(t.id==='st_metric'){S.st.metric=t.value;render();return}
 if(t.id==='st_view'){S.st.view=t.value;render()}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='ex_q'){S.exp.q=t.value;drawExplorer()}else if(t.id==='fa_q'){S.fa.q=t.value;drawFolders()}else if(t.id==='dr_q')drawDrawer();else if(t.dataset.lab!==undefined)S.files[+t.dataset.lab].label=t.value});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('hv',ev==='dragover');
 if(ev==='drop')parseFiles([...e.dataTransfer.files].filter(f=>/\.csv$/i.test(f.name))).then(drawFiles)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
render();
})();
</script></body></html>
