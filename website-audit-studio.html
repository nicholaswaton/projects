 const sc=r=>Math.round(r.s.o),T=S.th;
 $('#view').innerHTML=`<div class="bar noprint"><button class="btn pri" id="pr">Print / save as PDF</button><button class="btn" id="lg">Download issue log (CSV)</button></div>
 <div class="kpis">
 ${all?kpi('Overall score',sc(SR[0])+'/100','average of 7 dimensions',kc(sc(SR[0]))):kpi('Overall score','–')}
 ${kpi('Pages in scope',fmtN(A.length),libs.length+' site'+(libs.length===1?'':'s')+(S.stat?' · '+esc(statLbl()):''))}
 ${kpi('Backlog items',fmtN(bl.length),fmtN(inst)+' page-level findings in total')}
 ${kpi('Priority 1 items',fmtN(p1.length),fmtN(sum(p1,x=>x.n))+' findings',p1.length?'r':'g')}</div>
 <div class="card"><h3>Scorecard</h3><p class="mut">Each dimension is 0–100 (higher is better); the overall score is their average. Metadata completeness = average of the five core fields. URL &amp; naming = share with no URL issue. Indexing = share without a High indexing risk. ROT-free = share that is not redundant, obsolete or trivial. SEO readiness = average score. Drafts = share not stuck as a draft (&gt; ${T.stuck} days). Unique titles = share of live pages whose SEO title is not shared. Rows below the total are ${libs.length>1?'sites, then ':''}the biggest top-level sections. Click a row to list the pages.</p><div id="au_tb"></div></div>
 ${card('Overall score by top-level section','au1',340)}
 <div class="card"><h3>Action backlog</h3><p class="mut">Priority: P1 = live exposure or pages search engines cannot describe; P2 = SEO quality, workflow and language; P3 = housekeeping. Effort and severity are rule-of-thumb defaults, not estimates. Owner = the account that last updated most of the affected pages. Click a row to list the pages.</p><div id="au_bl"></div></div>
 <div class="card"><h3>Scope and sign-off</h3><p class="mut">Sites: ${esc(libs.join(', '))} · Section filter: ${esc(S.scope?[S.scope.lib,...S.scope.parts].join(' › '):'none')} · Status filter: ${esc(S.stat?statLbl():'all')} · As-of date: ${fmtD(S.asOf)} · Stale after ${T.stale} y · Draft abandoned after ${T.stuck} d · SEO title ${T.tMin}–${T.tMax} chars · Description ${T.dMin}–${T.dMax} chars · URL limit ${T.slugMax} chars · Default language: ${esc(LN(T.lang))} · Live statuses: ${esc([...S.live].join(', '))} · Default-image pattern: ${esc(T.img||'none')} · URL pattern: ${esc(T.pat||'none')} · Title pattern: ${esc(T.tpat||'none')}</p>
 <div class="sign"><div>Prepared by / date</div><div>Reviewed by / date</div><div>Approved by / date</div></div></div>`;
 regTable('au_tb',[{k:'name',l:'Scope',v:r=>r.name},{k:'n',l:'Pages',v:r=>r.as.length,num:1,f:r=>fmtN(r.as.length)},...PN.map((n,i)=>({k:'p'+i,l:n,v:r=>m1(r.s.p[i]),num:1,f:r=>hb(Math.round(r.s.p[i]))})),{k:'o',l:'Overall',v:r=>r.s.o,num:1,f:r=>hb(sc(r))}],SR,{k:'n',dir:-1,limit:50,file:'scorecard.csv',click:r=>gl(r.name+' — pages','',r.as,{cols:cl('u','lib','p','st','fs','rk','rot','seo')})});
 simpleBar('au1',SR.filter(r=>r.name!=='All pages in view'&&!libs.includes(r.name)).map(r=>[r.name.replace(/^Section: /,''),sc(r),hcol(sc(r))]),{h:true,lw:160,max:100});
 const pb={P1:'r',P2:'o',P3:'m'};
 regTable('au_bl',[{k:'id',l:'ID',v:x=>x.id},{k:'p',l:'Priority',v:x=>x.p,f:x=>`<span class="b ${pb[x.p]}">${x.p}</span>`},{k:'area',l:'Area',v:x=>x.area},{k:'txt',l:'Action',v:x=>x.txt,f:x=>esc(x.txt)},{k:'sev',l:'Severity',v:x=>x.sev},{k:'eff',l:'Effort',v:x=>x.eff},{k:'n',l:'Pages',v:x=>x.n,num:1,f:x=>fmtN(x.n)},{k:'sh',l:'% of view',v:x=>m1(100*x.n/A.length),num:1,f:x=>P(x.n,A.length)},{k:'ow',l:'Owner (most pages)',v:x=>x.owner,f:x=>esc(x.owner)+' ('+fmtN(x.on)+')'}],bl,{k:'p',dir:1,limit:60,file:'action-backlog.csv',click:x=>gl(x.id+' · '+x.txt,x.area+' · '+x.p,x.rows,{cols:cl('u','lib','p','st','ed','rk','rot','seo')})});
 $('#pr').onclick=()=>window.print();
 $('#lg').onclick=()=>dl('audit-issue-log.csv',bl.flatMap(x=>x.rows.map(a=>({'Backlog ID':x.id,Priority:x.p,Area:x.area,Issue:x.txt,Site:a.lib,'Page ID':a.id,Slug:a.slug,URL:a.url,Name:a.name,'SEO title':a.sT,Section:a.path,Status:a.status,'Last updated by':a.ed,'Last update':fmtD(a.upd)}))))};

/* events */
document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest(s);let x;
 if(c('a[data-ext]'))return;
 if(x=c('[data-tab]')){S.tab=x.dataset.tab;render();return}
 if(x=c('[data-lib]')){const n=x.dataset.lib;S.active.has(n)?S.active.delete(n):S.active.add(n);if(S.scope&&!S.active.has(S.scope.lib))S.scope=null;render();return}
 if(c('[data-scope-clear]')){S.scope=null;render();return}
 if(x=c('[data-drill]')){const f=DRILLS[x.dataset.drill];f&&f();return}
 if(x=c('th[data-tb]')){const id=x.dataset.tb,tb=TB[id],k=x.dataset.k;if(tb.k===k)tb.dir*=-1;else{tb.k=k;tb.dir=tb.cols.find(q=>q.k===k).num?-1:1}drawTable(id);return}
 if(x=c('[data-more]')){e.preventDefault();TB[x.dataset.more].limit+=200;drawTable(x.dataset.more);return}
 if(x=c('[data-exp]')){e.preventDefault();exportTable(x.dataset.exp);return}
 if(x=c('tr[data-i]')){const tb=TB[x.dataset.tb];if(tb&&tb.click)tb.click(tb.rows[+x.dataset.i]);return}
 if(c('[data-dr-close]')){closeDrawer();return}
 if(c('[data-dr-back]')){if(DR&&DR.prev)openDrawer(DR.prev);return}
 if(c('[data-dr-explore]')){if(DR&&DR.ex)go({tab:'explorer',...DR.ex});return}
 if(x=c('[data-mview]')){S.mm.view=x.dataset.mview;render();return}
 if(x=c('[data-ins]')){go(S._ins[+x.dataset.ins].g);return}
 if(x=c('[data-insl]')){const f=S._ins[+x.dataset.insl];gl(htmlTxt(f.t),insArea(f.area),f.rows,f.cols?{cols:f.cols}:{});return}
 if(x=c('[data-insf-sev]')){S.insF.sev=x.dataset.insfSev;render();return}
 if(c('#ins_dl')){dl('nuggets.csv',S._ins.map(x=>({Severity:SEVN[x.sev],Report:insArea(x.area),Finding:htmlTxt(x.t),Detail:htmlTxt(x.x),Pages:x.rows?x.rows.length:''})));return}
 if(x=c('[data-crumb]')){e.preventDefault();const k=+x.dataset.crumb;S.scope=k<0?null:{lib:S.scope.lib,parts:S.scope.parts.slice(0,k)};render();return}
 if(c('[data-miss-clear]')){S.exp.miss='';render();return}
 if(x=c('[data-rm]')){S.files.splice(+x.dataset.rm,1);drawFiles();return}
 if(c('#go')){analyse();return}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='fi'){parseFiles(t.files).then(drawFiles);t.value='';return}
 if(t.hasAttribute('data-scope')){const l=+t.dataset.scope,v=t.value;S.scope=l===0?(v?{lib:v,parts:[]}:null):{lib:S.scope.lib,parts:S.scope.parts.slice(0,l-1).concat(v?[v]:[])};render();return}
 if(t.hasAttribute('data-stat')){S.stat=t.value;render();return}
 if(t.hasAttribute('data-insf-area')){S.insF.area=t.value;render();return}
 const ex={ex_lib:'lib',ex_flag:'flag',ex_lang:'lang',ex_direct:'direct'};if(ex[t.id]){S.exp[ex[t.id]]=t.value;drawExplorer();return}
 if(t.id==='fa_i'){S.fa.issue=t.value;drawFolders();return}
 if(t.id==='st_lib'){S.st.lib=t.value;render();return}
 if(t.id==='st_metric'){S.st.metric=t.value;render();return}
 if(t.id==='st_view'){S.st.view=t.value;render()}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='ex_q'){S.exp.q=t.value;drawExplorer()}else if(t.id==='fa_q'){S.fa.q=t.value;drawFolders()}else if(t.id==='dr_q')drawDrawer();
 else if(t.dataset.lab!==undefined)S.files[+t.dataset.lab].label=t.value;else if(t.dataset.base!==undefined)S.files[+t.dataset.base].base=t.value});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('hv',ev==='dragover');
 if(ev==='drop')parseFiles([...e.dataTransfer.files].filter(f=>/\.csv$/i.test(f.name))).then(drawFiles)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
render();
})();
</script></body></html>
